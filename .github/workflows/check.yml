name: ตรวจคุณภาพต้นแบบและฐาน S1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
  s1-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run db:start
      - run: npm run build
      - run: npm run check:s1
      - run: npm run test:s2
      - run: npm run test:s3
      - run: npm run db:test:fresh
      - run: npm run db:validation:start
      - run: npm run test:validation:local
      - run: npm run test:backup-restore
      - if: always()
        run: npm run db:validation:stop
      - if: always()
        run: npm run db:stop
